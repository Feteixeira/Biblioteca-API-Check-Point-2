services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biblioteca-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Biblioteca@2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Executa database/schema.sql uma vez quando o SQL Server estiver pronto
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: biblioteca-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Biblioteca@2026}"
    volumes:
      - ./database:/scripts:ro
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -f 65001 -i /scripts/schema.sql && echo 'Banco biblioteca pronto.'"]
    restart: "no"

  api:
    build: .
    container_name: biblioteca-api
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=biblioteca;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "${DB_PASSWORD:-Biblioteca@2026}"
    ports:
      - "8080:8080"

volumes:
  sqlserver-data:
