# Usado apenas pelos testes automatizados (mvn test): H2 em memória em modo SQL Server.
spring:
  datasource:
    url: jdbc:h2:mem:biblioteca-test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
